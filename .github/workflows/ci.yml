
name: Android CI

on:
  pull_request:
    branches:
      - main
      - development
    types: [opened, reopened, synchronize]

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37.1
        run: |
          sdkmanager "platforms;android-37.1" "build-tools;37.0.0"
          yes | sdkmanager --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DEV, STG and PROD
        run: |
          chmod +x gradlew
          ./gradlew assembleDevDebug assembleStgDebug assembleProdDebug

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37.1
        run: |
          sdkmanager "platforms;android-37.1" "build-tools;37.0.0"
          yes | sdkmanager --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew testDevDebugUnitTest testStgDebugUnitTest testProdDebugUnitTest
          
